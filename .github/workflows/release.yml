name: Release

# A version tag attaches the built packages to a GitHub release, for installing
# by hand (apk add --allow-untrusted). Devices normally update from the feed
# (see feed.yml).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with the OpenWrt SDK
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD:/feed:ro" -v "$PWD/out:/out" openwrt/sdk:x86-64-openwrt-25.12 \
            sh /feed/.github/scripts/sdk-build.sh /feed /out
          (cd out && sha256sum * > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
