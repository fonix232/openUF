name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lua-tests:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop luarocks
          # lua-cjson requires lua5.1 dev headers; lua-openssl needs libssl-dev
          sudo apt-get install -y liblua5.1-dev libssl-dev
          sudo luarocks --lua-version 5.1 install lua-cjson
          # lua-openssl (rock name "openssl"): the AES backend, as on the device.
          sudo luarocks --lua-version 5.1 install openssl LUA_INCDIR=/usr/include/lua5.1

      - name: Run tests
        working-directory: openuf
        run: lua5.1 tests/run_tests.lua

      - name: Stripped tree (what the package ships) is equivalent and passes
        working-directory: openuf
        run: |
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          sh tools/strip-tree.sh --verify

      - name: No stray globals
        working-directory: openuf
        run: sh tools/globals-check.sh

  simulate:
    name: End-to-end adoption simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 liblua5.1-dev lua-bitop luarocks libssl-dev python3-pip
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          # LUA_INCDIR must be given explicitly or luarocks fails with
          # "Failed finding Lua header files" on a clean runner.
          sudo luarocks --lua-version 5.1 install lua-cjson LUA_INCDIR=/usr/include/lua5.1
          sudo luarocks --lua-version 5.1 install luasocket LUA_INCDIR=/usr/include/lua5.1
          sudo luarocks --lua-version 5.1 install openssl LUA_INCDIR=/usr/include/lua5.1
          # pip (not apt python3-pycryptodome, which ships the Cryptodome namespace)
          # so the controller's `import Crypto` resolves.
          pip3 install --break-system-packages pycryptodome

      # Drives crypto (lua-openssl CBC), TCP/HTTP POST, the http_post partial-read
      # path, and TNBU parse — i.e. the integration a device performs at adoption.
      # This exercises what unit tests can't and guards against runtime-only
      # regressions like the ones this OpenWrt 25.12 pass fixed.
      - name: Run adoption simulation
        working-directory: openuf
        run: |
          sh tools/simulate.sh --adopt
          sh tools/simulate.sh

  python-controller-syntax:
    name: Python controller syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile openuf/tools/test_controller.py && echo "OK"

  shell-syntax:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the package's shell scripts
        run: |
          for f in openuf/tools/strip-tree.sh openuf/tools/deploy.sh openuf/tools/globals-check.sh \
                   openuf/files/openuf.uci-defaults openuf/files/openuf.init \
                   openuf/files/openuf-bootstrap.init openuf/src/hook/*.sh \
                   .github/scripts/sdk-build.sh \
                   luci-theme-unifi/install.sh luci-theme-unifi/test/*.sh \
                   luci-theme-unifi/root/etc/uci-defaults/*; do
            sh -n "$f" || exit 1
          done
          for f in luci-theme-unifi/test/*.cjs; do
            node --check "$f" || exit 1
          done
          # LuCI evaluates its modules as function bodies (they end in a
          # top-level return), so parse them the same way.
          for f in $(find luci-theme-unifi/htdocs -name '*.js'); do
            node -e 'new Function(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || exit 1
          done
